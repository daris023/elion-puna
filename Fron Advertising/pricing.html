</head>
<body>

<header>
  <div class="logo">FRON</div>
</header>

<section class="section">

  <table>

      <th>Type</th>
      <th>Location</th>

      <td>Billboard</td>
      <td>City Center</td>
      <td>1 Month</td>
      <td>€500</td>

    </tr>

    <tr>
      <td>LED Screen</td>
      <td>Main Square</td>
      <td>1 Week</td>
      <td>€300</td>
      <td><button onclick="buy('LED','Main Square','300')">Buy Now</button></td>
    </tr>

  </table>
</section>

<script src="script.js"></script>
</body>
</html>
