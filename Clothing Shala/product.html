<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shala Clothing - Product</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

<header class="header">
  <h1>Shala Clothing</h1>
  <nav>
    <a href="index.html">Home</a>
    <button id="cart-btn" class="btn">Cart (0)</button>
  </nav>
</header>

<section class="product-detail">
  <div class="product-image">
    <img id="product-img" src="" alt="Product Image">
  </div>
  <div class="product-info">
    <h2 id="product-title">Product Title</h2>
    <p class="price" id="product-price">0.00</p>
    <label>Size:</label>
    <select id="product-size" class="size">
      <option>S</option>
      <option>M</option>
      <option>L</option>
    </select>
    <button id="add-to-cart-btn" class="btn">Add to Cart</button>
    <p id="product-desc" class="description"></p>
  </div>
</section>

<footer class="footer">
  <p>© 2026 Shala Clothing. All Rights Reserved.</p>
</footer>

</body>
</html>
